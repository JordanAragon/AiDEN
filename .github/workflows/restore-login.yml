name: Restore login image

on:
  push:
    branches:
      - temp-fix-login-2026-09-24

permissions:
  contents: write

jobs:
  restore:
    if: "!startsWith(github.event.head_commit.message, 'chore: restore login image') && !startsWith(github.event.head_commit.message, 'chore: remove temporary extraction workflow')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download original image
        run: curl -L --fail --silent --show-error "https://raw.githubusercontent.com/JordanAragon/AiDEN_/main/src/assets/imagenes/login.png" -o src/assets/imagenes/login.png
      - name: Commit restored image and remove workflow
        env:
          BRANCH: temp-fix-login-2026-09-24
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/imagenes/login.png
          git commit -m "chore: restore login image"
          rm .github/workflows/restore-login.yml
          git add -u .github/workflows/restore-login.yml
          git commit -m "chore: remove temporary extraction workflow"
          git push origin HEAD:$BRANCH
