name: AiDEN CI

on:
  push:
    branches: ["main", "hardening/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  calidad:
    name: Lint y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  navegador:
    name: Pruebas de navegador
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias Node
        run: npm ci

      - name: Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          playwright install --with-deps chromium

      - name: axe-core
        run: curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.2/axe.min.js -o pruebas/axe.min.js

      - name: Build
        run: npm run build

      - name: Flujos principales
        run: |
          python pruebas/prueba_admin.py
          python pruebas/prueba_roles.py

      - name: Accesibilidad y teclado
        run: python pruebas/a11y.py

      - name: Tooltips
        run: python pruebas/tooltip.py
