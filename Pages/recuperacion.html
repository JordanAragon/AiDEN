<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Assets/CSS/recuperacion.css">
    <title>Recuperar contraseña - AiDEN</title>
</head>
<body>
    <main class="contenedor-principal">
        <article class="tarjeta-recuperacion">
            <a href="../index.html" class="btn-regresar">← Regresar</a>

            <header class="encabezado-tarjeta">
                <h1>Recuperar contraseña</h1>
                <p>Ingresa el correo registrado y enviaremos un enlace para recuperar el acceso al sistema.</p>
            </header>

            <section class="cuerpo-tarjeta">
                <form action="../Pages/login.html" method="GET">
                    <fieldset class="grupo-formulario">
                        <label for="email-recuperacion">Correo electrónico</label>
                        <input type="email" id="email-recuperacion" placeholder="nombre@empresa.com" required>
                    </fieldset>

                    <button type="submit" class="btn-enviar">Enviar enlace</button>
                </form>
            </section>
        </article>
    </main>
</body>
</html>
