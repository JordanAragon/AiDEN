<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/CSS/singup.css">
    <title>Registro - AiDEN</title>
</head>
<body>
    <main class="form">
        <section class="formulario">
            <a href="../index.html" class="btn-regresar">← Regresar</a>

            <header class="titulo">
                <h1>Crear cuenta en AiDEN</h1>
                <p>Registra tu perfil para empezar a gestionar viveros, lotes y recursos.</p>
            </header>

            <form action="../Pages/reportes-dashboard.html" method="GET" class="register">
                <fieldset class="datos">
                    <label for="nombre">Nombre</label>
                    <input class="itext" id="nombre" type="text" placeholder="Ingrese su nombre" required>

                    <label for="apellido">Apellidos</label>
                    <input class="itext" id="apellido" type="text" placeholder="Ingrese sus apellidos" required>

                    <label for="email">Correo electrónico</label>
                    <input class="itext" id="email" type="email" placeholder="correo@empresa.com" required>

                    <label for="pass">Contraseña</label>
                    <input class="itext" id="pass" type="password" placeholder="Cree una nueva contraseña" required>

                    <label for="rol">Rol</label>
                    <select id="rol" name="rol" required>
                        <option value="">Seleccione su rol</option>
                        <option value="administrador">Administrador</option>
                        <option value="supervisor">Supervisor</option>
                        <option value="operario">Operario</option>
                    </select>
                </fieldset>

                <fieldset class="terminos">
                    <input type="checkbox" id="check-term" required>
                    <label for="check-term" class="textterm">Acepto los términos y condiciones</label>
                </fieldset>

                <button class="boton_registro" type="submit">Registrarme</button>
            </form>

            <footer class="redireccionLogin">
                <p>¿Tienes una cuenta? <a href="../Pages/login.html">Inicia sesión</a></p>
            </footer>
        </section>

        <aside class="image">
            <figure>
                <img src="../Assets/IMG/dash.png" alt="Dashboard ejecutivo de AiDEN">
                <figcaption>Un tablero para revisar cumplimiento, alertas y trazabilidad.</figcaption>
            </figure>
        </aside>
    </main>
</body>
</html>
