<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/CSS/singup.css">
    <title>Registro - AiDEN</title>
</head>
<body>
    <main class="auth-page">
        <section class="auth-shell">
            <article class="auth-form-panel" aria-label="Registro de usuario">
                <header class="auth-heading">
                    <a href="../index.html" class="auth-brand">AiDEN</a>
                    <p class="eyebrow">Crear cuenta</p>
                    <h1>Registra tu acceso</h1>
                    <p>Completa los datos basicos para ingresar a la demo de gestion del vivero.</p>
                </header>

                <form action="dashboard.html" method="GET" class="auth-form register">
                    <fieldset>
                        <legend>Datos de usuario</legend>
                        <section class="row g-3">
                            <section class="col-sm-6">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input id="nombre" name="nombre" type="text" class="form-control" placeholder="Tu nombre" required>
                            </section>
                            <section class="col-sm-6">
                                <label for="apellido" class="form-label">Apellidos</label>
                                <input id="apellido" name="apellido" type="text" class="form-control" placeholder="Tus apellidos" required>
                            </section>
                            <section class="col-12">
                                <label for="email" class="form-label">Correo electronico</label>
                                <input id="email" name="email" type="email" class="form-control" placeholder="nombre@correo.com" required>
                            </section>
                            <section class="col-sm-6">
                                <label for="pass" class="form-label">Contrasena</label>
                                <input id="pass" name="pass" type="password" class="form-control" placeholder="Crea una contrasena" required>
                            </section>
                            <section class="col-sm-6">
                                <label for="pass2" class="form-label">Confirmar contrasena</label>
                                <input id="pass2" name="pass2" type="password" class="form-control" placeholder="Repite la contrasena" required>
                            </section>
                        </section>
                    </fieldset>

                    <section class="form-check">
                        <input type="checkbox" id="check-term" class="form-check-input" required>
                        <label class="form-check-label" for="check-term">Acepto los terminos y condiciones</label>
                    </section>

                    <button class="btn btn-aiden w-100" type="submit">Registrarme</button>
                </form>

                <footer class="auth-footer">
                    <p>Ya tienes una cuenta? <a href="login.html">Inicia sesion</a></p>
                </footer>
            </article>

            <aside class="auth-visual">
                <figure>
                    <img src="../Assets/IMG/vivero.jpg" alt="Vivero con plantas monitoreadas por AiDEN">
                    <figcaption>Roles, permisos y modulos conectados para operar el vivero.</figcaption>
                </figure>
            </aside>
        </section>
    </main>
    <script>
        document.querySelector("form").addEventListener("submit", function (event) {
            const pass = document.querySelector("#pass").value;
            const pass2 = document.querySelector("#pass2").value;

            event.preventDefault();
            if (pass !== pass2) {
                alert("Las contrasenas no coinciden.");
                return;
            }

            localStorage.removeItem("aiden-role");
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
