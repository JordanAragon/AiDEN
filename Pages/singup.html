<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - GREENMIND</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>

  <main class="auth-card">
    
    <!-- Sección Formulario -->
    <section class="auth-section">
      <nav class="top-nav">
        <a href="#" class="back-link">&larr; Regresar</a>
      </nav>

      <header class="auth-header">
        <h1>¡Empecemos!</h1>
      </header>

      <form action="#" method="POST" class="auth-form">
        <p class="form-group">
          <label for="signup-nombre">Nombre</label>
          <input type="text" id="signup-nombre" name="nombre" placeholder="Ingrese su nombre" required>
        </p>

        <p class="form-group">
          <label for="signup-apellidos">Apellidos</label>
          <input type="text" id="signup-apellidos" name="apellidos" placeholder="Ingrese sus apellidos" required>
        </p>

        <p class="form-group">
          <label for="signup-email">Correo Electrónico</label>
          <input type="email" id="signup-email" name="email" placeholder="Ej: Correo@gmail.com" required>
        </p>

        <p class="form-group">
          <label for="signup-password">Contraseña</label>
          <input type="password" id="signup-password" name="password" placeholder="Cree una nueva contraseña" required>
        </p>

        <p class="form-group">
          <label for="signup-roles">Roles</label>
          <select id="signup-roles" name="roles" required>
            <option value="" disabled selected>Seleccione su rol</option>
            <option value="viverista">Viverista</option>
            <option value="cliente">Cliente</option>
            <option value="admin">Administrador</option>
          </select>
        </p>

        <p class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" name="terms" required>
            <span>Acepto los términos y Condiciones</span>
          </label>
        </p>

        <button type="submit" class="btn-primary">Regístrate</button>
      </form>

      <footer class="auth-footer">
        <p>¿Tienes una cuenta? <a href="login.html" class="highlight-link">Inicia Sesión</a></p>
      </footer>
    </section>

    <!-- Sección Visual Reservada -->
    <aside class="auth-media">
      <!-- Espacio reservado para banner visual o imagen -->
    </aside>

  </main>

</body>
</html>
