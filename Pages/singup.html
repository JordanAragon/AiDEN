<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/CSS/login.css">
    <link rel="stylesheet" href="../Assets/CSS/singup.css">
    <title>Registro - AiDEN</title>
</head>
<body>
    <main class="auth-page">
        <section class="auth-shell">
            <article class="auth-form-panel" aria-label="Registro de usuario">
                <header class="auth-heading">
                    <h1>Crear cuenta</h1>
                    <p>Completa el formulario para unirte a AiDEN.</p>
                </header>

                <form action="dashboard.html" method="GET" class="auth-form register">
                    <fieldset>
                        <legend>Datos de registro</legend>
                        <section class="mb-3">
                            <label for="nombre" class="form-label">Nombre Completo</label>
                            <input id="nombre" name="nombre" type="text" class="form-control" placeholder="María González Torres" required>
                        </section>

                        <section class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input id="email" name="email" type="email" class="form-control" placeholder="maria@vivero.com" required>
                        </section>

                        <section class="mb-3">
                            <label for="pass" class="form-label">Contraseña</label>
                            <input id="pass" name="pass" type="password" class="form-control" placeholder="Mínimo 8 caracteres" required>
                        </section>

                        <section class="mb-3">
                            <label for="pass2" class="form-label">Confirmar Contraseña</label>
                            <input id="pass2" name="pass2" type="password" class="form-control" placeholder="Repite tu contraseña" required>
                        </section>
                    </fieldset>

                    <section class="form-check mb-3">
                        <input type="checkbox" id="check-term" class="form-check-input" required>
                        <label class="form-check-label" for="check-term">
                            Acepto los <a href="#" target="_blank">Términos de Uso</a> y la <a href="#" target="_blank">Política de Privacidad</a> de AiDEN.
                        </label>
                    </section>

                    <button class="btn btn-aiden w-100" type="submit">Crear Cuenta</button>
                </form>

                <footer class="auth-footer">
                    <p>¿Ya tienes cuenta? <a href="login.html">Iniciar Sesión</a></p>
                    <a href="../index.html" class="back-home">&larr; Volver al inicio</a>
                </footer>
            </article>

            <aside class="auth-visual">
                <header class="visual-brand">
                    <span class="brand-badge">🍃</span> AiDEN
                </header>
                <section class="visual-content bottom-aligned">
                    <h2>Empieza a gestionar tu vivero hoy</h2>
                    <p>Crea tu cuenta y accede a todas las herramientas operativas de AiDEN.</p>
                </section>
            </aside>
        </section>
    </main>
    <script>
        document.querySelector("form").addEventListener("submit", function (event) {
            const pass = document.querySelector("#pass").value;
            const pass2 = document.querySelector("#pass2").value;

            event.preventDefault();
            if (pass !== pass2) {
                alert("Las contraseñas no coinciden.");
                return;
            }

            localStorage.removeItem("aiden-role");
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
