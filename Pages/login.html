<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Assets/CSS/login.css">
    <link rel="shortcut icon" href="/Assets/Img/favicon.png" type="image/x-icon">
    <title>Login - AiDEN</title>
</head>
<body>
    <main class="login-page">
        
        <section class="form-container">
            
            <a href="../index.html" class="btn-regresar">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
                </svg>
                Regresar
            </a>

            <header class="encabezado-login">
                <h1>Ingresa a tu cuenta</h1>
                <p>Ingresa tus datos para continuar</p>
            </header>

            <article class="formulario-login">
                <form action="/Pages/users.html" method="GET">
                    
                    <fieldset class="campo">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" placeholder="Ingresa tu correo" required>
                    </fieldset>

                    <fieldset class="campo">
                        <header class="header-campo">
                            <label for="contraseña">Contraseña</label>
                            <a href="../Pages/recuperacion.html" class="olvido">Olvidé mi contraseña</a>
                        </header>
                        <input type="password" id="contraseña" placeholder="Ingresa tu contraseña" required>
                    </fieldset>

                    <fieldset class="recordar-opcion">
                        <input type="checkbox" id="recordar">
                        <label for="recordar">Recordar cuenta</label>
                    </fieldset>

                    <button type="submit" class="btn-inicio">Inicio</button>
                </form>
            </article>

            <footer class="pie-pagina">
                <p>¿No tienes cuenta? <a href="../Pages/singup.html">Regístrate</a></p>
            </footer>
        </section>

        <aside class="banner-lateral">
            <img src="../Assets/Img/vivero.png" alt="Banner decorativo de Vivero">
        </aside>
    </main>
</body>
</html>
