<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Assets/CSS/login.css">
    <title>Login - AiDEN</title>
</head>
<body>
    <main class="login-page">
        <section class="form-container">
            <a href="../index.html" class="btn-regresar">← Regresar</a>

            <header class="encabezado-login">
                <h1>Ingresa a tu cuenta</h1>
                <p>Accede al control de lotes, inventario, fases y alarmas de cumplimiento.</p>
            </header>

            <article class="formulario-login">
                <form action="../Pages/reportes-dashboard.html" method="GET">
                    <fieldset class="campo">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" placeholder="Ingresa tu correo" required>
                    </fieldset>

                    <fieldset class="campo">
                        <header class="header-campo">
                            <label for="contrasena">Contraseña</label>
                            <a href="../Pages/recuperacion.html" class="olvido">Olvidé mi contraseña</a>
                        </header>
                        <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" required>
                    </fieldset>

                    <fieldset class="recordar-opcion">
                        <input type="checkbox" id="recordar">
                        <label for="recordar">Recordar cuenta</label>
                    </fieldset>

                    <button type="submit" class="btn-inicio">Entrar al sistema</button>
                </form>
            </article>

            <footer class="pie-pagina">
                <p>¿No tienes cuenta? <a href="../Pages/singup.html">Regístrate</a></p>
            </footer>
        </section>

        <aside class="banner-lateral">
            <figure>
                <img src="../Assets/IMG/vivero.png" alt="Vivero tecnificado AiDEN">
                <figcaption>AiDEN conecta el trabajo de campo con información útil para decidir.</figcaption>
            </figure>
        </aside>
    </main>
</body>
</html>
