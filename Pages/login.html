<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/CSS/login.css">
    <title>Login - AiDEN</title>
</head>
<body>
    <main class="login-page">
        <section class="form-container">
            <a href="../index.html" class="btn-regresar">Regresar</a>

            <header class="encabezado-login">
                <p class="brand-mark">AiDEN</p>
                <h1>Gestion inteligente de viveros</h1>
                <p>Bienvenido. Centraliza cultivos, inventario, ambiente, calidad y reportes en una sola plataforma agricola.</p>
            </header>

            <article class="formulario-login">
                <form action="dashboard.html" method="GET">
                    <section class="campo">
                        <label for="correo">Correo electronico</label>
                        <input type="email" id="correo" placeholder="supervisor@aiden.co" required>
                    </section>

                    <section class="campo">
                        <section class="header-campo">
                            <label for="password">Contrasena</label>
                            <a href="recuperacion.html" class="olvido">Olvidaste tu contrasena?</a>
                        </section>
                        <input type="password" id="password" placeholder="Ingresa tu contrasena" required>
                    </section>

                    <section class="campo">
                        <label for="rol-demo">Rol para la demostracion</label>
                        <select id="rol-demo" name="rol">
                            <option value="supervisor">Supervisor</option>
                            <option value="administrador">Administrador</option>
                            <option value="operario">Operario</option>
                        </select>
                    </section>

                    <button type="submit" class="btn-inicio">Iniciar sesion</button>
                </form>
            </article>
        </section>

        <aside class="banner-lateral">
            <figure>
                <img src="../Assets/IMG/vivero2.png" alt="Vivero tecnificado monitoreado con AiDEN">
                <figcaption>Datos claros para decidir mejor en cada lote del vivero.</figcaption>
            </figure>
        </aside>
    </main>
    <script>
        document.querySelector("form").addEventListener("submit", function (event) {
            const role = document.querySelector("#rol-demo").value;
            const homes = {
                administrador: "dashboard-admin.html",
                supervisor: "dashboard.html",
                operario: "dashboard-operario.html"
            };
            localStorage.setItem("aiden-role", role);
            event.preventDefault();
            window.location.href = homes[role];
        });
    </script>
</body>
</html>
