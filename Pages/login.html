<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - GREENMIND</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="auth-card">
    
    <!-- Sección Formulario -->
    <section class="auth-section">
      <nav class="top-nav">
        <a href="#" class="back-link">&larr; Regresar</a>
      </nav>

      <header class="auth-header">
        <h1>Ingresa a tu cuenta</h1>
        <p class="subtitle">Ingresa tus datos para continuar</p>
      </header>

      <form action="#" method="POST" class="auth-form">
        <p class="form-group">
          <label for="login-email">Correo</label>
          <input type="email" id="login-email" name="email" placeholder="Ingresa tu correo" required>
        </p>

        <p class="form-group">
          <span class="label-row">
            <label for="login-password">Contraseña</label>
            <a href="#" class="forgot-link">Olvidé mi contraseña</a>
          </span>
          <input type="password" id="login-password" name="password" placeholder="Ingresa tu contraseña" required>
        </p>

        <p class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" name="remember">
            <span>Recordar cuenta</span>
          </label>
        </p>

        <button type="submit" class="btn-primary">Inicio</button>
      </form>

      <footer class="auth-footer">
        <p>¿No tienes cuenta? <a href="signup.html" class="highlight-link">Regístrate</a></p>
      </footer>
    </section>

    <!-- Sección Visual (Imagen Lateral) -->
    <aside class="auth-media">
      <img src="plant-greenhouse.jpg" alt="Persona trabajando en un vivero cuidando plantas">
    </aside>

  </main>

</body>
</html>
