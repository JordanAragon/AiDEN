<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/CSS/login.css">
    <title>Login - AiDEN</title>
</head>
<body>
    <main class="auth-page">
        <section class="auth-shell">
            <article class="auth-form-panel" aria-label="Inicio de sesion">
                <header class="auth-heading">
                    <a href="../index.html" class="auth-brand">AiDEN</a>
                    <p class="eyebrow">Acceso al sistema</p>
                    <h1>Bienvenido de vuelta</h1>
                    <p>Ingresa tus credenciales para continuar con la gestion del vivero.</p>
                </header>

                <form action="dashboard.html" method="GET" class="auth-form">
                    <fieldset>
                        <legend>Credenciales</legend>
                        <section class="mb-3">
                            <label for="correo" class="form-label">Correo electronico</label>
                            <input type="email" id="correo" name="correo" class="form-control" placeholder="nombre@correo.com" required>
                        </section>

                        <section class="mb-2">
                            <section class="field-row">
                                <label for="password" class="form-label">Contrasena</label>
                                <a href="recuperacion.html">Olvide mi contrasena</a>
                            </section>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contrasena" required>
                        </section>
                    </fieldset>

                    <section class="form-check">
                        <input type="checkbox" id="recordar" name="recordar" class="form-check-input">
                        <label class="form-check-label" for="recordar">Recordar sesion</label>
                    </section>

                    <button type="submit" class="btn btn-aiden w-100">Iniciar sesion</button>
                </form>

                <footer class="auth-footer">
                    <p>No tienes cuenta? <a href="singup.html">Registrate</a></p>
                </footer>
            </article>

            <aside class="auth-visual">
                <figure>
                    <img src="../Assets/IMG/vivero.png" alt="Vivero con plantas monitoreadas por AiDEN">
                    <figcaption>Gestion de lotes, inventario y alertas desde una sola interfaz.</figcaption>
                </figure>
            </aside>
        </section>
    </main>
    <script>
        document.querySelector("form").addEventListener("submit", function (event) {
            event.preventDefault();
            localStorage.removeItem("aiden-role");
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
